# SearXNG configuration for the epfo_smart_discovery search backend.
# Only the keys that differ from SearXNG defaults are set.
use_default_settings:
  engines:
    keep_only:
      - bing
      - github
      - arxiv
      - semantic scholar
      - pubmed

search:
  formats:
    - html
    - json
  safe_search: 1

server:
  method: "GET"
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

# Explicitly enable the verified engines and assign their categories.
# Bing is the primary general-web engine; the others support technical/scientific searches.
engines:
  - name: bing
    disabled: false
    categories:
      - general
  - name: github
    disabled: false
    categories:
      - it
      - general
  - name: arxiv
    disabled: false
    categories:
      - science
  - name: semantic scholar
    disabled: false
    categories:
      - science
  - name: pubmed
    disabled: false
    categories:
      - science
