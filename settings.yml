# SearXNG configuration for the epfo_smart_discovery search backend.
# Only the keys that differ from SearXNG defaults are set.
use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo
      - startpage
      - github
      - arxiv
      - semantic scholar
      - pubmed

search:
  formats:
    - html
    - json
  safe_search: 1

server:
  method: "GET"
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

# Multiple general-web engines provide resilience when one upstream engine
# returns poor or degraded results. Technical and scientific engines remain
# available for model and research discovery.
engines:
  - name: bing
    disabled: false
    categories:
      - general
  - name: brave
    disabled: false
    categories:
      - general
  - name: duckduckgo
    disabled: false
    categories:
      - general
  - name: startpage
    disabled: false
    categories:
      - general
  - name: github
    disabled: false
    categories:
      - it
      - general
  - name: arxiv
    disabled: false
    categories:
      - science
  - name: semantic scholar
    disabled: false
    categories:
      - science
  - name: pubmed
    disabled: false
    categories:
      - science
